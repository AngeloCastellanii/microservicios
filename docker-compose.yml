services:
  postgres:
    image: postgres:16-alpine
    container_name: studyy-postgres
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: studyy
      POSTGRES_PASSWORD: studyy
      POSTGRES_DB: academic
    volumes:
      - studyy_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyy -d academic"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  studyy_pg_data:
