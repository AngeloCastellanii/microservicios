syntax = "proto3";

package acadflow.notifications;

service NotificationService {
  rpc CreateNotification (CreateNotificationRequest) returns (Notification);
  rpc ListNotifications (ListNotificationsRequest) returns (ListNotificationsResponse);
  rpc MarkRead (MarkReadRequest) returns (Notification);
  rpc Dismiss (DismissRequest) returns (Notification);
  rpc GetNotification (GetNotificationRequest) returns (Notification);
}

enum NotificationKind {
  NOTIFICATION_KIND_UNSPECIFIED = 0;
  NORMAL = 1;
  PERSISTENT = 2;
}

message Notification {
  string id = 1;
  NotificationKind kind = 2;
  string title = 3;
  string body = 4;
  string related_item_id = 5;
  string related_item_title = 6;
  string related_subject_name = 7;
  string read_at = 8;
  string dismissed_at = 9;
  string created_at = 10;
}

message CreateNotificationRequest {
  NotificationKind kind = 1;
  string title = 2;
  string body = 3;
  string related_item_id = 4;
}

message ListNotificationsRequest {
  bool include_dismissed = 1;
  bool unread_only = 2;
  NotificationKind kind = 3;
}

message ListNotificationsResponse {
  repeated Notification notifications = 1;
}

message MarkReadRequest {
  string id = 1;
}

message DismissRequest {
  string id = 1;
}

message GetNotificationRequest {
  string id = 1;
}
