syntax = "proto3";

package acadflow.academic;

service AcademicService {
  // Periodos (trimestre / semestre)
  rpc CreatePeriod (CreatePeriodRequest) returns (Period);
  rpc ListPeriods (ListPeriodsRequest) returns (ListPeriodsResponse);
  rpc SetActivePeriod (SetActivePeriodRequest) returns (Period);
  rpc DeletePeriod (DeletePeriodRequest) returns (DeleteResponse);

  // Materias
  rpc CreateSubject (CreateSubjectRequest) returns (Subject);
  rpc ListSubjects (ListSubjectsRequest) returns (ListSubjectsResponse);
  rpc GetSubject (GetSubjectRequest) returns (Subject);
  rpc UpdateSubject (UpdateSubjectRequest) returns (Subject);
  rpc DeleteSubject (DeleteSubjectRequest) returns (DeleteResponse);

  // Ítems
  rpc CreateItem (CreateItemRequest) returns (Item);
  rpc ListItems (ListItemsRequest) returns (ListItemsResponse);
  rpc GetItem (GetItemRequest) returns (Item);
  rpc UpdateItem (UpdateItemRequest) returns (Item);
  rpc DeleteItem (DeleteItemRequest) returns (DeleteResponse);

  // Horario
  rpc UpsertScheduleSlot (UpsertScheduleSlotRequest) returns (ScheduleSlot);
  rpc ListSchedule (ListScheduleRequest) returns (ListScheduleResponse);
  rpc DeleteScheduleSlot (DeleteScheduleSlotRequest) returns (DeleteResponse);

  // Apuntes
  rpc CreateNote (CreateNoteRequest) returns (Note);
  rpc ListNotes (ListNotesRequest) returns (ListNotesResponse);
  rpc UpdateNote (UpdateNoteRequest) returns (Note);
  rpc DeleteNote (DeleteNoteRequest) returns (DeleteResponse);
}

enum PeriodKind {
  PERIOD_KIND_UNSPECIFIED = 0;
  TRIMESTER = 1;
  SEMESTER = 2;
}

enum ItemType {
  ITEM_TYPE_UNSPECIFIED = 0;
  TASK = 1;
  PROJECT = 2;
  EXAM = 3;
}

enum ItemStatus {
  ITEM_STATUS_UNSPECIFIED = 0;
  PENDING = 1;
  IN_PROGRESS = 2;
  DONE = 3;
  SCHEDULED = 4;
}

message DeleteResponse {
  bool ok = 1;
}

message Period {
  string id = 1;
  string name = 2;
  PeriodKind kind = 3;
  int32 year = 4;
  bool is_active = 5;
  string created_at = 6;
  string updated_at = 7;
}

message CreatePeriodRequest {
  string name = 1;
  PeriodKind kind = 2;
  int32 year = 3;
  bool set_active = 4;
}

message ListPeriodsRequest {}

message ListPeriodsResponse {
  repeated Period periods = 1;
}

message SetActivePeriodRequest {
  string id = 1;
}

message DeletePeriodRequest {
  string id = 1;
}

message Subject {
  string id = 1;
  string period_id = 2;
  string name = 3;
  string description = 4;
  string color = 5;
  string created_at = 6;
  string updated_at = 7;
}

message CreateSubjectRequest {
  string period_id = 1;
  string name = 2;
  string description = 3;
  string color = 4;
}

message ListSubjectsRequest {
  string period_id = 1;
}

message ListSubjectsResponse {
  repeated Subject subjects = 1;
}

message GetSubjectRequest {
  string id = 1;
}

message UpdateSubjectRequest {
  string id = 1;
  string name = 2;
  string description = 3;
  string color = 4;
}

message DeleteSubjectRequest {
  string id = 1;
}

message Item {
  string id = 1;
  string subject_id = 2;
  string title = 3;
  string description = 4;
  ItemType type = 5;
  ItemStatus status = 6;
  string due_at = 7;
  string created_at = 8;
  string updated_at = 9;
  string subject_name = 10;
}

message CreateItemRequest {
  string subject_id = 1;
  string title = 2;
  string description = 3;
  ItemType type = 4;
  ItemStatus status = 5;
  string due_at = 6;
}

message ListItemsRequest {
  string subject_id = 1;
  string period_id = 2;
  ItemType type = 3;
  bool upcoming_only = 4;
  int32 limit = 5;
}

message ListItemsResponse {
  repeated Item items = 1;
}

message GetItemRequest {
  string id = 1;
}

message UpdateItemRequest {
  string id = 1;
  string title = 2;
  string description = 3;
  ItemType type = 4;
  ItemStatus status = 5;
  string due_at = 6;
}

message DeleteItemRequest {
  string id = 1;
}

message ScheduleSlot {
  string id = 1;
  string subject_id = 2;
  int32 day_of_week = 3;
  string start_time = 4;
  string end_time = 5;
  string label = 6;
  string created_at = 7;
  string updated_at = 8;
  string subject_name = 9;
}

message UpsertScheduleSlotRequest {
  string id = 1;
  string subject_id = 2;
  int32 day_of_week = 3;
  string start_time = 4;
  string end_time = 5;
  string label = 6;
}

message ListScheduleRequest {
  string period_id = 1;
}

message ListScheduleResponse {
  repeated ScheduleSlot slots = 1;
}

message DeleteScheduleSlotRequest {
  string id = 1;
}

message Note {
  string id = 1;
  string period_id = 2;
  string subject_id = 3;
  string title = 4;
  string body = 5;
  string created_at = 6;
  string updated_at = 7;
  string subject_name = 8;
}

message CreateNoteRequest {
  string period_id = 1;
  string subject_id = 2;
  string title = 3;
  string body = 4;
}

message ListNotesRequest {
  string period_id = 1;
  string subject_id = 2;
  bool general_only = 3;
}

message ListNotesResponse {
  repeated Note notes = 1;
}

message UpdateNoteRequest {
  string id = 1;
  string title = 2;
  string body = 3;
  string subject_id = 4;
}

message DeleteNoteRequest {
  string id = 1;
}
